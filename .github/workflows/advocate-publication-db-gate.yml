name: Advocate publication database gate

on:
  pull_request:
    branches:
      - dev
    paths:
      - "supabase/migrations/*.sql"
      - "supabase/tests/*publication*.sql"
      - "supabase/tests/**/*publication*"
      - "supabase/tests/*initial_owner*.sql"
      - "supabase/tests/**/*initial_owner*"
      - "supabase/tests/*invitation*.sql"
      - "supabase/tests/**/*invitation*"
      - "supabase/tests/*email_proof*.sql"
      - "supabase/tests/**/*email_proof*"
      - "supabase/tests/*password_recovery*.sql"
      - "supabase/tests/**/*password_recovery*"
      - "supabase/tests/sponsor_recent_authentication_management.test.sql"
      - "tests/database/**/*publication*"
      - "tests/database/**/*initial-owner*"
      - "tests/database/**/*email-proof*"
      - "tests/database/support/*.mjs"
      - "tests/provider/**"
      - "src/lib/advocates/attributionIdentityCookie.ts"
      - "src/lib/auth/emailProof*.ts"
      - "src/lib/auth/supabaseEmailProofIssuer.ts"
      - "src/lib/auth/passwordRecoveryClient.ts"
      - "src/lib/sponsorships/accountClaim.ts"
      - "src/lib/sponsorships/checkout/requestSecurity.ts"
      - "src/lib/sponsorships/crypto.ts"
      - "src/lib/sponsorships/management/passwordlessAccess.ts"
      - "src/lib/sponsorships/management/passwordlessRateLimit.ts"
      - "src/lib/sponsorships/management/responseBoundSupabaseCookies.ts"
      - "src/lib/sponsorships/management/sponsorEmailConfirmation.ts"
      - "src/app/api/auth/reset-password/route.ts"
      - "src/app/api/auth/verify-otp/route.ts"
      - "src/app/api/auth/change-password/route.ts"
      - "src/app/forgot-password/**"
      - "src/lib/sponsorships/management/statelessAuth.ts"
      - "src/utils/passwordValidation.ts"
      - "src/utils/supabase/server.ts"
      - "tests/auth/*email-proof*.spec.ts"
      - "tests/auth/password-recovery-client.spec.ts"
      - "tests/auth/password-reset-request-route.spec.ts"
      - "tests/auth/verify-otp.spec.ts"
      - "tests/auth/change-password.spec.ts"
      - "tests/advocates/attribution-identity-auth-routes.spec.ts"
      - "tests/advocates/attribution-identity-session-auth-routes.spec.ts"
      - "tests/auth/supabase-email-proof-issuer.spec.ts"
      - "tests/sponsorships/stateless-email-auth-client.spec.ts"
      - "supabase/config.toml"
      - "supabase/seed.sql"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - "yarn.lock"
      - ".github/workflows/advocate-publication-db-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ADVOCATE_PUBLICATION_DOCKER_NETWORK: advocate-publication-gate-${{ github.run_id }}

concurrency:
  group: advocate-publication-db-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-authority:
    name: Publication authority database tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify email proof supersession harness safety
        env:
          PW_NO_WEBSERVER: "1"
        run: >-
          yarn playwright test
          tests/provider/supabase-email-proof-supersession.spec.ts
          --workers=1
          --retries=0

      - name: Verify shared email proof issuer boundary
        env:
          PW_NO_WEBSERVER: "1"
        run: >-
          yarn playwright test
          tests/auth/email-proof-issuance-gate.spec.ts
          tests/auth/supabase-email-proof-issuer.spec.ts
          tests/auth/email-proof-provider-inventory.spec.ts
          tests/auth/password-recovery-client.spec.ts
          tests/auth/password-reset-request-route.spec.ts
          tests/auth/verify-otp.spec.ts
          tests/auth/change-password.spec.ts
          tests/advocates/attribution-identity-auth-routes.spec.ts
          tests/advocates/attribution-identity-session-auth-routes.spec.ts
          tests/sponsorships/stateless-email-auth-client.spec.ts
          --workers=1
          --retries=0

      - name: Create loopback-only Docker network
        run: >-
          docker network create
          --driver bridge
          --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1
          "$ADVOCATE_PUBLICATION_DOCKER_NETWORK"

      - name: Start local Supabase
        run: >-
          yarn supabase start
          --network-id "$ADVOCATE_PUBLICATION_DOCKER_NETWORK"

      - name: Verify Supabase ports are loopback only
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t published_bindings < <(
            docker ps \
              --filter "label=com.supabase.cli.project=creator-share-www" \
              --quiet |
              while read -r container; do
                docker inspect "$container" \
                  --format '{{range $port, $bindings := .NetworkSettings.Ports}}{{range $bindings}}{{println .HostIp}}{{end}}{{end}}'
              done |
              sed '/^$/d' |
              sort -u
          )
          if (( ${#published_bindings[@]} == 0 )); then
            echo "No local Supabase ports were published" >&2
            exit 1
          fi
          for host_ip in "${published_bindings[@]}"; do
            if [[ "$host_ip" != "127.0.0.1" && "$host_ip" != "::1" ]]; then
              echo "Local Supabase published a non-loopback port" >&2
              exit 1
            fi
          done

      - name: Run focused initial owner database tests
        run: |
          yarn supabase test db \
            --network-id "$ADVOCATE_PUBLICATION_DOCKER_NETWORK" \
            supabase/tests/advocate_initial_owner_onboarding.test.sql \
            supabase/tests/advocate_invitation_email_delivery.test.sql \
            supabase/tests/advocate_invitation_authentication_rate_limit.test.sql

      - name: Run initial owner concurrency harness
        env:
          ADVOCATE_INITIAL_OWNER_CONCURRENCY_EVIDENCE_PATH: ${{ runner.temp }}/advocate-initial-owner-concurrency-evidence.json
        run: yarn test:advocate:initial-owner-concurrency

      - name: Upload sanitized initial owner concurrency evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: advocate-initial-owner-concurrency-evidence
          path: ${{ runner.temp }}/advocate-initial-owner-concurrency-evidence.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Run focused publication database tests
        run: |
          yarn supabase test db \
            --network-id "$ADVOCATE_PUBLICATION_DOCKER_NETWORK" \
            supabase/tests/advocate_publication_approval_boundary.test.sql \
            supabase/tests/advocate_publication_canary_reports.test.sql \
            supabase/tests/advocate_publication_from_canary.test.sql \
            supabase/tests/advocate_publication_operation_recovery.test.sql \
            supabase/tests/advocate_publication_sentinel_reservation.test.sql

      - name: Run publication concurrency harness
        env:
          ADVOCATE_PUBLICATION_CONCURRENCY_EVIDENCE_PATH: ${{ runner.temp }}/advocate-publication-concurrency-evidence.json
        run: yarn test:advocate:publication-concurrency

      - name: Upload sanitized concurrency evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: advocate-publication-concurrency-evidence
          path: ${{ runner.temp }}/advocate-publication-concurrency-evidence.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Run shared email proof issuance database tests
        run: >-
          yarn supabase test db
          --network-id "$ADVOCATE_PUBLICATION_DOCKER_NETWORK"
          supabase/tests/shared_email_proof_issuance_gate.test.sql

      - name: Run password recovery authorization database tests
        run: >-
          yarn supabase test db
          --network-id "$ADVOCATE_PUBLICATION_DOCKER_NETWORK"
          supabase/tests/sponsor_recent_authentication_management.test.sql
          supabase/tests/password_recovery_receipt_consumption.test.sql

      - name: Run shared email proof issuance concurrency harness
        env:
          EMAIL_PROOF_ISSUANCE_CONCURRENCY_EVIDENCE_PATH: ${{ runner.temp }}/email-proof-issuance-concurrency-evidence.json
        run: yarn test:email-proof-issuance-concurrency

      - name: Upload sanitized email proof issuance concurrency evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: email-proof-issuance-concurrency-evidence
          path: ${{ runner.temp }}/email-proof-issuance-concurrency-evidence.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Load local Supabase canary credentials
        shell: bash
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/ff029-supabase-status.env"
          credentials_file="$RUNNER_TEMP/ff029-supabase-credentials.env"
          trap 'rm -f "$status_file"' EXIT
          node_modules/.bin/supabase status -o env > "$status_file"
          set -a
          source "$status_file"
          set +a
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          umask 077
          {
            printf 'FF029_LOCAL_SUPABASE_ANON_KEY=%q\n' "$ANON_KEY"
            printf 'FF029_LOCAL_SUPABASE_SERVICE_ROLE_KEY=%q\n' "$SERVICE_ROLE_KEY"
          } > "$credentials_file"

      - name: Observe local email proof supersession behavior
        continue-on-error: true
        shell: bash
        env:
          FF029_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          credentials_file="$RUNNER_TEMP/ff029-supabase-credentials.env"
          trap 'rm -f "$credentials_file"' EXIT
          set -a
          source "$credentials_file"
          set +a
          yarn canary:supabase-email-proof-supersession:local

      - name: Upload sanitized email proof supersession evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: supabase-email-proof-supersession-evidence
          path: test-results/provider/ff029-supabase-email-proof-supersession.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop local Supabase
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/ff029-supabase-credentials.env"
          yarn supabase stop --no-backup

      - name: Remove loopback-only Docker network
        if: ${{ always() }}
        run: |
          if docker network inspect "$ADVOCATE_PUBLICATION_DOCKER_NETWORK" >/dev/null 2>&1; then
            docker network rm "$ADVOCATE_PUBLICATION_DOCKER_NETWORK"
          fi
