      - "src/components/advocates/admin/DomainStatus.tsx"
      - "src/components/advocates/admin/BrandingSettingsClient.tsx"
      - "src/components/advocates/admin/AnalyticsDashboard.tsx"
      - "src/components/advocates/admin/PublicMetricSettingsClient.tsx"
      - "src/components/advocates/AdvocateImpactMetrics.tsx"
      - "src/components/advocates/admin/PortalNavigation.tsx"
      - "src/components/advocates/admin/PortalShell.tsx"
      - "tests/auth/*email-proof*.spec.ts"
      - "tests/auth/password-recovery-client.spec.ts"
      - "tests/auth/password-reset-request-route.spec.ts"
      - "tests/auth/verify-otp.spec.ts"
      - "tests/auth/change-password.spec.ts"
      - "tests/auth/creator-share-admin-invitation-route.spec.ts"
      - "tests/advocates/attribution-identity-auth-routes.spec.ts"
      - "tests/advocates/attribution-identity-session-auth-routes.spec.ts"
      - "tests/advocates/invitation-email-worker.spec.ts"
      - "tests/advocates/invitation-rollout-safety.spec.ts"
      - "tests/advocates/portal-invitation-route.spec.ts"
      - "tests/advocates/portal-access.spec.ts"
      - "tests/advocates/portal-domain-ui.spec.ts"
      - "tests/advocates/portal-branding.spec.ts"
      - "tests/advocates/portal-branding-route.spec.ts"
      - "tests/advocates/portal-logo-reservation.spec.ts"
      - "tests/advocates/portal-logo-route.spec.ts"
      - "tests/advocates/service-role-client-timeout.spec.ts"
      - "docs/advocate-domain-publication-runbook.md"
      - "docs/advocate-payment-release-runbook.md"
      - "docs/advocate-platform-roadmap.md"
      - "tests/auth/supabase-email-proof-issuer.spec.ts"
      - "tests/sponsorships/passwordless-access.spec.ts"
      - "tests/sponsorships/passwordless-rate-limit.spec.ts"
      - "tests/sponsorships/account-claim.spec.ts"
      - "tests/sponsorships/sponsor-claim-routes.spec.ts"
      - "tests/sponsorships/sponsor-email-confirmation.spec.ts"
      - "tests/sponsorships/stateless-email-auth-client.spec.ts"
      - "supabase/config.toml"
      - "supabase/seed.sql"
      - ".nvmrc"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - "yarn.lock"
      - ".github/workflows/advocate-publication-db-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ADVOCATE_PUBLICATION_DOCKER_NETWORK: advocate-publication-gate-${{ github.run_id }}

concurrency:
  group: advocate-publication-db-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-authority:
    name: Publication authority database tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify email proof supersession harness safety
        env:
          PW_NO_WEBSERVER: "1"
        run: >-
          yarn playwright test
          tests/provider/supabase-email-proof-supersession.spec.ts
          --workers=1
          --retries=0

      - name: Verify shared email proof issuer boundary
        env:
          PW_NO_WEBSERVER: "1"
        run: >-
          yarn playwright test
          tests/auth/email-proof-issuance-gate.spec.ts
          tests/auth/supabase-email-proof-issuer.spec.ts
          tests/auth/email-proof-provider-inventory.spec.ts
          tests/auth/password-recovery-client.spec.ts
          tests/auth/password-reset-request-route.spec.ts
          tests/auth/verify-otp.spec.ts
          tests/auth/change-password.spec.ts
          tests/auth/creator-share-admin-invitation-route.spec.ts
          tests/advocates/attribution-identity-auth-routes.spec.ts
          tests/advocates/attribution-identity-session-auth-routes.spec.ts
          tests/advocates/invitation-email-worker.spec.ts
          tests/advocates/invitation-rollout-safety.spec.ts
          tests/advocates/portal-invitation-route.spec.ts
          tests/advocates/service-role-client-timeout.spec.ts
          tests/sponsorships/passwordless-access.spec.ts
          tests/sponsorships/passwordless-rate-limit.spec.ts
          tests/sponsorships/account-claim.spec.ts
          tests/sponsorships/sponsor-claim-routes.spec.ts
          tests/sponsorships/sponsor-email-confirmation.spec.ts
          tests/sponsorships/stateless-email-auth-client.spec.ts
          --workers=1
          --retries=0

      - name: Create loopback-only Docker network
        run: >-
          docker network create
          --driver bridge
          --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1
          "$ADVOCATE_PUBLICATION_DOCKER_NETWORK"

      - name: Verify advocate portal administration
        env:
          PW_NO_WEBSERVER: "1"
        run: >-
          yarn playwright test
          tests/advocates/portal-access.spec.ts
          tests/advocates/portal-domain-ui.spec.ts
          tests/advocates/portal-branding.spec.ts
          tests/advocates/portal-branding-route.spec.ts
          tests/advocates/portal-logo-reservation.spec.ts
          tests/advocates/portal-logo-route.spec.ts
          --workers=1
          --retries=0

      - name: Verify provider-free provisioning and publication boundary
        env:
          PW_NO_WEBSERVER: "1"
        run: >-
          yarn playwright test
          tests/advocates/provisioning-start.spec.ts
          tests/advocates/provisioning.spec.ts
          tests/advocates/publication-canary-challenge.spec.ts
          tests/advocates/publication-canary-client-operation.spec.ts
          tests/advocates/publication-canary-database.spec.ts
          tests/advocates/publication-canary-execute.spec.ts
          tests/advocates/publication-canary-operation.spec.ts
          tests/advocates/publication-canary-route.spec.ts
          tests/advocates/publication-canary-runner.spec.ts
          tests/advocates/publication-canary-runtime.spec.ts
          tests/advocates/publication-canary-sentinel-bootstrap.spec.ts
          tests/advocates/publication-canary-sentinel.spec.ts
          tests/advocates/publication-canary-worker.spec.ts
          --workers=1
          --retries=0

      - name: Verify attribution settlement application boundary
        env:
          PW_NO_WEBSERVER: "1"
        run: >-
          yarn playwright test
          tests/advocates/exposure-attribution-identity.spec.ts
          tests/advocates/exposure-broker-client.spec.ts
          tests/advocates/exposure-broker-server.spec.ts
          tests/advocates/exposure-broker-tracker.spec.ts
          tests/sponsorships/exposure.spec.ts
          tests/sponsorships/stripe-checkout.spec.ts
          tests/sponsorships/stripe-checkout-v2.spec.ts
          tests/sponsorships/stripe-provider-request.spec.ts
          tests/sponsorships/paypal-browser-payload.spec.ts
          tests/sponsorships/paypal-checkout-v2.spec.ts
          tests/sponsorships/paypal-provider-request.spec.ts
          tests/sponsorships/paypal-sponsorship-checkout.spec.ts
          tests/sponsorships/stripe-webhook-ingestion.spec.ts
          tests/sponsorships/paypal-webhook-ingestion.spec.ts
          tests/sponsorships/payment-gateway-event-worker.spec.ts
          tests/advocates/portal-analytics.spec.ts
          tests/advocates/portal-public-metrics-route.spec.ts
          tests/advocates/portal-public-metrics-ui.spec.ts
          tests/advocates/public-metric-release-worker.spec.ts
          tests/advocates/public-presentation-repository.spec.ts
          tests/advocates/public-presentation.spec.ts
          tests/advocates/public-impact-metrics.spec.ts
          tests/sponsorships/sponsor-welcome-email-worker.spec.ts
          --workers=1
          --retries=0

      - name: Start local Supabase
        run: >-
          yarn supabase start
          --network-id "$ADVOCATE_PUBLICATION_DOCKER_NETWORK"

      - name: Verify Supabase ports are loopback only
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t published_bindings < <(
            docker ps \
              --filter "label=com.supabase.cli.project=creator-share-www" \
              --quiet |
              while read -r container; do
                docker inspect "$container" \
                  --format '{{range $port, $bindings := .NetworkSettings.Ports}}{{range $bindings}}{{println .HostIp}}{{end}}{{end}}'
              done |
              sed '/^$/d' |
              sort -u
          )
          if (( ${#published_bindings[@]} == 0 )); then
            echo "No local Supabase ports were published" >&2
            exit 1
          fi
          for host_ip in "${published_bindings[@]}"; do
            if [[ "$host_ip" != "127.0.0.1" && "$host_ip" != "::1" ]]; then
              echo "Local Supabase published a non-loopback port" >&2
              exit 1
            fi
          done

      - name: Run focused initial owner database tests
        run: |
          yarn supabase test db \
            --network-id "$ADVOCATE_PUBLICATION_DOCKER_NETWORK" \
            supabase/tests/advocate_initial_owner_onboarding.test.sql \
            supabase/tests/advocate_invitation_email_delivery.test.sql \
            supabase/tests/advocate_invitation_authentication_rate_limit.test.sql

      - name: Run invitation proof settlement database tests
        run: >-
          yarn supabase test db
          --network-id "$ADVOCATE_PUBLICATION_DOCKER_NETWORK"
          supabase/tests/advocate_invitation_email_proof_settlement.test.sql

      - name: Run invitation proof quarantine concurrency harness
        env:
          ADVOCATE_INVITATION_PROOF_QUARANTINE_CONCURRENCY_EVIDENCE_PATH: ${{ runner.temp }}/advocate-invitation-proof-quarantine-concurrency-evidence.json
        run: yarn test:advocate:invitation-proof-quarantine-concurrency

      - name: Upload sanitized invitation proof quarantine concurrency evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: advocate-invitation-proof-quarantine-concurrency-evidence
          path: ${{ runner.temp }}/advocate-invitation-proof-quarantine-concurrency-evidence.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Run initial owner concurrency harness
        env:
          ADVOCATE_INITIAL_OWNER_CONCURRENCY_EVIDENCE_PATH: ${{ runner.temp }}/advocate-initial-owner-concurrency-evidence.json
        run: yarn test:advocate:initial-owner-concurrency

      - name: Upload sanitized initial owner concurrency evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: advocate-initial-owner-concurrency-evidence
          path: ${{ runner.temp }}/advocate-initial-owner-concurrency-evidence.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Run focused publication database tests
        run: |
          yarn supabase test db \
            --network-id "$ADVOCATE_PUBLICATION_DOCKER_NETWORK" \
            supabase/tests/advocate_publication_approval_boundary.test.sql \
            supabase/tests/advocate_publication_canary_reports.test.sql \
            supabase/tests/advocate_publication_from_canary.test.sql \
            supabase/tests/advocate_publication_operation_recovery.test.sql \
            supabase/tests/advocate_publication_sentinel_reservation.test.sql

      - name: Run publication concurrency harness
        env:
          ADVOCATE_PUBLICATION_CONCURRENCY_EVIDENCE_PATH: ${{ runner.temp }}/advocate-publication-concurrency-evidence.json
        run: yarn test:advocate:publication-concurrency

      - name: Upload sanitized concurrency evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: advocate-publication-concurrency-evidence
          path: ${{ runner.temp }}/advocate-publication-concurrency-evidence.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Run shared email proof issuance database tests
        run: >-
          yarn supabase test db
          --network-id "$ADVOCATE_PUBLICATION_DOCKER_NETWORK"
          supabase/tests/shared_email_proof_issuance_gate.test.sql

      - name: Run password recovery authorization database tests
        run: >-
          yarn supabase test db
          --network-id "$ADVOCATE_PUBLICATION_DOCKER_NETWORK"
          supabase/tests/sponsor_recent_authentication_management.test.sql
          supabase/tests/password_recovery_receipt_consumption.test.sql

      - name: Run sponsor account claim database tests
        run: >-
          yarn supabase test db
          --network-id "$ADVOCATE_PUBLICATION_DOCKER_NETWORK"
          supabase/tests/persistent_sponsor_account_claim_links.test.sql
          supabase/tests/sponsor_passwordless_email_delivery_limits.test.sql

      - name: Run attribution settlement integration gate
        run: >-
          yarn supabase test db
          --network-id "$ADVOCATE_PUBLICATION_DOCKER_NETWORK"
          supabase/tests/advocate_attribution_settlement_integration.test.sql

      - name: Run branding authority database tests
        run: >-
          yarn supabase test db
          --network-id "$ADVOCATE_PUBLICATION_DOCKER_NETWORK"
          supabase/tests/advocate_admin_settings_boundary.test.sql
          supabase/tests/advocate_logo_upload_reservations.test.sql

      - name: Run branding authority concurrency harness
        env:
          ADVOCATE_BRANDING_AUTHORITY_CONCURRENCY_EVIDENCE_PATH: ${{ runner.temp }}/advocate-branding-authority-concurrency-evidence.json
        run: yarn test:advocate:branding-authority-concurrency

      - name: Verify branding authority forced termination cleanup
        run: yarn test:advocate:branding-authority-termination

      - name: Upload sanitized branding authority concurrency evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: advocate-branding-authority-concurrency-evidence
          path: ${{ runner.temp }}/advocate-branding-authority-concurrency-evidence.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Run shared email proof issuance concurrency harness
        env:
          EMAIL_PROOF_ISSUANCE_CONCURRENCY_EVIDENCE_PATH: ${{ runner.temp }}/email-proof-issuance-concurrency-evidence.json
        run: yarn test:email-proof-issuance-concurrency

      - name: Upload sanitized email proof issuance concurrency evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: email-proof-issuance-concurrency-evidence
          path: ${{ runner.temp }}/email-proof-issuance-concurrency-evidence.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Load local Supabase canary credentials
        shell: bash
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/ff029-supabase-status.env"
          credentials_file="$RUNNER_TEMP/ff029-supabase-credentials.env"
          trap 'rm -f "$status_file"' EXIT
          node_modules/.bin/supabase status -o env > "$status_file"
          set -a
          source "$status_file"
          set +a
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          umask 077
          {
            printf 'FF029_LOCAL_SUPABASE_ANON_KEY=%q\n' "$ANON_KEY"
            printf 'FF029_LOCAL_SUPABASE_SERVICE_ROLE_KEY=%q\n' "$SERVICE_ROLE_KEY"
          } > "$credentials_file"

      - name: Observe local email proof supersession behavior
        continue-on-error: true
        shell: bash
        env:
          FF029_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          credentials_file="$RUNNER_TEMP/ff029-supabase-credentials.env"
          trap 'rm -f "$credentials_file"' EXIT
          set -a
          source "$credentials_file"
          set +a
          yarn canary:supabase-email-proof-supersession:local

      - name: Upload sanitized email proof supersession evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: supabase-email-proof-supersession-evidence
          path: test-results/provider/ff029-supabase-email-proof-supersession.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop local Supabase
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/ff029-supabase-credentials.env"
          yarn supabase stop --no-backup

      - name: Remove loopback-only Docker network
        if: ${{ always() }}
        run: |
          if docker network inspect "$ADVOCATE_PUBLICATION_DOCKER_NETWORK" >/dev/null 2>&1; then
            docker network rm "$ADVOCATE_PUBLICATION_DOCKER_NETWORK"
          fi
