name: Advocate WebKit gate

on:
  pull_request:
    branches:
      - dev
    paths:
      - "src/components/advocates/admin/CatalogSettingsClient.tsx"
      - "src/lib/advocates/admin/catalogForm.ts"
      - "src/app/forgot-password/**"
      - "src/lib/auth/passwordRecoveryClient.ts"
      - "tests/auth/password-recovery-browser.spec.ts"
      - "tests/advocates/portal-catalog-browser.spec.ts"
      - "tests/fixtures/advocate-catalog-harness/**"
      - "playwright.config.ts"
      - ".nvmrc"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/advocate-webkit-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-recovery:
    name: Catalog recovery in WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install browser runtimes
        run: yarn playwright install --with-deps chromium webkit

      - name: Verify catalog recovery
        run: yarn test:advocate:webkit

      - name: Verify password recovery in Chromium
        run: >-
          yarn playwright test
          tests/auth/password-recovery-browser.spec.ts
          --workers=1
          --retries=0

      - name: Verify password recovery in WebKit
        env:
          RUN_WEBKIT_BROWSER_INTEGRATION: "1"
        run: >-
          yarn playwright test
          tests/auth/password-recovery-browser.spec.ts
          --workers=1
          --retries=0
